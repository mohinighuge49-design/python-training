<style>

/* =====================================================
   🎓 REGISTER PAGE
===================================================== */

.register-page{

    width:100% !important;

    min-height:calc(100vh - 90px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:40px 20px;

}


/* =====================================================
   💙💗 REGISTER CARD
===================================================== */

.register-card{

    position:relative;

    overflow:hidden;

    width:100% !important;

    max-width:520px;

    margin-left:auto;
    margin-right:auto;

    background:
        linear-gradient(
            rgba(255,255,255,.78),
            rgba(255,255,255,.78)
        ),
        linear-gradient(
            135deg,
            #5587d2,
            #ec4899
        ) !important;

    background-origin:border-box;

    background-clip:padding-box, border-box;

    border:2px solid transparent !important;

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 0 0 1px #5587d2,
        0 0 14px rgba(236,72,153,.18),
        0 25px 70px rgba(30,64,175,.16) !important;

    transition:
        transform .4s ease,
        box-shadow .4s ease;

}


/* CARD HOVER */

.register-card:hover{

    transform:translateY(-3px);

    box-shadow:
        0 0 0 1px #5587d2,
        0 0 20px rgba(236,72,153,.25),
        0 30px 75px rgba(30,64,175,.20) !important;

}


/* =====================================================
   ✨ TOP GLOW
===================================================== */

.register-card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-100px;
    right:-60px;

    background:
        radial-gradient(
            circle,
            rgba(59,130,246,.22),
            transparent 70%
        );

    border-radius:50%;

    pointer-events:none;

}


/* =====================================================
   💜 BOTTOM GLOW
===================================================== */

.register-card::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    bottom:-120px;
    left:-80px;

    background:
        radial-gradient(
            circle,
            rgba(124,58,237,.16),
            transparent 70%
        );

    border-radius:50%;

    pointer-events:none;

}


/* =====================================================
   🎓 REGISTER ICON
===================================================== */

.register-icon{

    font-size:42px;

    margin-bottom:5px;

    animation:
        registerFloat 3s ease-in-out infinite;

}


@keyframes registerFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}


/* =====================================================
   💙💗 REGISTER TITLE
===================================================== */

.register-title{

    letter-spacing:.5px;

    margin-bottom:5px;

    background:
        linear-gradient(
            90deg,
            #5587d2,
            #ec4899
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    background-clip:text;

    font-weight:700;

}


.register-subtitle{

    font-size:14px;

}


/* =====================================================
   🏷️ LABELS
===================================================== */

.register-card label{

    color:#334155;

}


/* =====================================================
   📝 INPUTS
===================================================== */

.register-card .form-control{

    background:
        rgba(255,255,255,.75);

    border:
        1px solid #dbe4f0;

    transition:
        border-color .3s,
        box-shadow .3s,
        transform .3s;

}


.register-card .form-control:hover{

    border-color:#93c5fd;

}


.register-card .form-control:focus{

    background:#fff;

    border-color:#5587d2;

    box-shadow:
        0 0 0 4px rgba(85,135,210,.12);

    transform:translateY(-1px);

}


.register-card .form-control::placeholder{

    color:#94a3b8;

}


/* =====================================================
   💗 REGISTER BUTTON
===================================================== */

.register-btn{

    background:
        linear-gradient(
            135deg,
            #7f45b9,
            #f472b6,
            #7f4ebe
        ) !important;

    border:none !important;

    color:#ffffff !important;

    box-shadow:
        0 8px 20px rgba(127,69,185,.25);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.register-btn:hover{

    transform:translateY(-3px);

    color:#ffffff !important;

    box-shadow:
        0 14px 30px rgba(127,69,185,.40);

}


.register-btn:focus{

    color:#ffffff !important;

    box-shadow:
        0 0 0 4px rgba(127,69,185,.18),
        0 8px 20px rgba(127,69,185,.25);

}


/* =====================================================
   🔗 LOGIN LINK
===================================================== */

.register-link{

    color:#2563eb !important;

    transition:.3s;

}


.register-link:hover{

    color:#ec4899 !important;

}


/* =====================================================
   🌙 DARK MODE
===================================================== */

.dark-mode .register-card{

    background:
        linear-gradient(
            rgba(30,41,59,.84),
            rgba(30,41,59,.84)
        ),
        linear-gradient(
            135deg,
            #5587d2,
            #ec4899
        ) !important;

    background-origin:border-box;

    background-clip:padding-box, border-box;

    border:2px solid transparent !important;

    box-shadow:
        0 0 0 1px #5587d2,
        0 0 15px rgba(236,72,153,.25),
        0 25px 70px rgba(0,0,0,.45) !important;

}


.dark-mode .register-card label{

    color:#e2e8f0 !important;

}


.dark-mode .register-subtitle{

    color:#94a3b8 !important;

}


/* DARK MODE INPUTS */

.dark-mode .register-card .form-control{

    background:
        rgba(15,23,42,.75) !important;

    color:#f8fafc !important;

    border:
        1px solid #475569 !important;

}


.dark-mode .register-card .form-control::placeholder{

    color:#94a3b8 !important;

}


.dark-mode .register-card .form-control:focus{

    background:
        rgba(15,23,42,.95) !important;

    color:#fff !important;

    border-color:#5587d2 !important;

    box-shadow:
        0 0 0 4px rgba(85,135,210,.16);

}


/* DARK MODE LINK */

.dark-mode .register-card .text-muted{

    color:#94a3b8 !important;

}


.dark-mode .register-link{

    color:#60a5fa !important;

}


.dark-mode .register-link:hover{

    color:#f472b6 !important;

}


/* =====================================================
   📱 MOBILE
===================================================== */

@media(max-width:576px){

    .register-page{

        padding:25px 15px;

    }

    .register-card .card-body{

        padding:30px 22px !important;

    }

    .register-icon{

        font-size:36px;

    }

    .register-title{

        font-size:26px;

    }

}
/* =====================================================
   🔧 REGISTER WIDTH FIX
===================================================== */

.register-page{
    width:100% !important;
    min-height:calc(100vh - 90px);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px 20px;
}


/* ROW FULL WIDTH */

.register-page > .row{
    width:100% !important;

    margin-left:0 !important;
    margin-right:0 !important;

    display:flex !important;
    flex-wrap:wrap !important;

    justify-content:center !important;
}


/* COLUMN */

.register-page .col-md-6,
.register-page .col-lg-5{
    width:100% !important;
    max-width:520px !important;

    flex:0 0 100% !important;
}


/* CARD */

.register-page .register-card{
    width:100% !important;
    max-width:520px !important;

    margin-left:auto !important;
    margin-right:auto !important;
}


/* CARD BODY */

.register-page .card-body{
    width:100% !important;
}


/* INPUTS */

.register-page .form-control{
    width:100% !important;
}


/* BUTTON */

.register-page .register-btn{
    width:100% !important;
}

</style>

{% endblock %}
